{% extends 'base.html' %}
{% load i18n crispy_forms_tags %}

{% block full_page %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-logo">SocialNet</h1>
        <h2 class="auth-title">{% trans "Bienvenue" %} 👋</h2>
        
        <form method="post" class="text-left mb-6">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-full mt-4 justify-center py-3 text-lg">{% trans "Se connecter" %}</button>
        </form>
        
        <p class="text-muted">
            {% trans "Nouveau sur SocialNet ?" %} 
            <a href="{% url 'accounts:register' %}" class="font-semibold text-primary hover:underline">{% trans "Créer un compte" %}</a>
        </p>
    </div>
</div>
{% endblock %}
